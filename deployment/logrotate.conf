# Logrotate configuration for Arbitrage Bot
# Prevents disk fill-up by rotating and compressing logs
#
# Installation:
# sudo cp deployment/logrotate.conf /etc/logrotate.d/arbitrage-bot
# sudo chown root:root /etc/logrotate.d/arbitrage-bot
# sudo chmod 644 /etc/logrotate.d/arbitrage-bot
#
# Test:
# sudo logrotate -d /etc/logrotate.d/arbitrage-bot  # Dry run
# sudo logrotate -f /etc/logrotate.d/arbitrage-bot  # Force rotation

# Main application logs
/var/log/arbitrage-bot/*.log {
    # Rotate daily
    daily

    # Keep 7 days of logs (configurable based on disk space)
    rotate 7

    # Maximum size before rotation (100MB)
    size 100M

    # Compress old logs (saves ~90% disk space)
    compress

    # Delay compression by 1 cycle (keeps yesterday's log uncompressed)
    delaycompress

    # Don't error if log file is missing
    missingok

    # Don't rotate if log is empty
    notifempty

    # Create new log file with these permissions after rotation
    create 0644 arbitrage-bot arbitrage-bot

    # Use date as suffix (e.g., bot.log-20250113)
    dateext
    dateformat -%Y%m%d

    # Compress using gzip
    compresscmd /bin/gzip
    compressoptions -9

    # Post-rotation script (optional: send old logs to archive)
    postrotate
        # Reload application to use new log file (if needed)
        # systemctl reload arbitrage-bot || true

        # Optional: Copy compressed logs to archive location
        # find /var/log/arbitrage-bot -name "*.gz" -mtime +1 -exec cp {} /archive/logs/ \;
    endscript

    # Pre-rotation script (optional: alert before rotation)
    prerotate
        # Optional: Send alert that logs will be rotated
        # echo "Rotating arbitrage bot logs" | logger -t arbitrage-bot
    endscript
}

# Docker container logs (if using Docker)
/var/lib/docker/containers/*/*.log {
    daily
    rotate 3
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Alert logs (separate rotation for monitoring alerts)
/var/log/arbitrage-bot/alerts/*.log {
    daily
    rotate 14
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0644 arbitrage-bot arbitrage-bot
    dateext
}

# Error logs (keep longer for debugging)
/var/log/arbitrage-bot/errors/*.log {
    daily
    rotate 30
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    create 0644 arbitrage-bot arbitrage-bot
    dateext

    # Send critical error log rotation alert
    postrotate
        if [ -s $1 ]; then
            echo "Error log rotated and contained data" | logger -t arbitrage-bot -p user.warning
        fi
    endscript
}

# Trade execution logs (keep for audit trail)
/var/log/arbitrage-bot/trades/*.log {
    daily
    rotate 90
    size 200M
    compress
    delaycompress
    missingok
    notifempty
    create 0644 arbitrage-bot arbitrage-bot
    dateext

    # Archive old trade logs
    postrotate
        # Move compressed trade logs to archive
        # find /var/log/arbitrage-bot/trades -name "*.gz" -mtime +7 -exec mv {} /archive/trades/ \;
    endscript
}
